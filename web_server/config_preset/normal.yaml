# Web-server preset: normal
Agent:
  name: CaesarExplorer
  draw_fsm: false

CaesarAgent:
  additional_starting_queries: 9
  max_iterations: 200
  save_graph_interval: 5

  use_quick_explore: True
  quick_explore_insights: True
  exploration_llm_config:
    model: gpt-5.6-luna
    reasoning_effort: low

  adapt_role: True

ArtifactSynthesizer:
  synthesis_iterations: 10
  synthesis_drafts: 3
  synthesis_merge_artifacts: true
  synthesis_eli5: false
  synthesis_eli5_length: [null, 450]
  synthesis_human_eval: false
  synthesis_max_length: null
  synthesis_iteration_filter: null
  synthesis_generate_images: 1

ImageGenerator:
  quality: medium
  # 60 candidates: top-1 selection (noisiest target — LLM-judge tie rate
  # 67%) benefits from a broader pool than fast's 30. Still ~2.5x cheaper
  # than the 150 default; sits in the steep part of the NDCG curve.
  max_candidates_to_score: 60

LLMHandler:
  model: gpt-5.6-luna
  reasoning_effort: low

AgentMemory:
  enabled: false
  use_graph: false

ChromaClientManager:
  model: gpt-5.4-mini
  reasoning_effort: low

BraveSearch:
  use_ddgs: True

Logger:
  include_caller_info: "rome"
  level: "info"
