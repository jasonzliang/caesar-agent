# Web-server preset: fast
# Standalone caesar's caesar/config/config_preset/nano.yaml is unchanged.
Agent:
  name: CaesarExplorer
  draw_fsm: false

CaesarAgent:
  additional_starting_queries: 9
  max_iterations: 200
  save_graph_interval: 5

  use_quick_explore: True
  quick_explore_insights: False
  exploration_llm_config:
    model: gpt-5.6-luna
    reasoning_effort: low

  adapt_role: True

ArtifactSynthesizer:
  synthesis_iterations: 10
  synthesis_drafts: 3
  synthesis_merge_artifacts: true
  synthesis_eli5: false
  synthesis_eli5_length: [null, 450]
  synthesis_human_eval: false
  synthesis_max_length: null
  synthesis_iteration_filter: null
  synthesis_generate_images: 1

ImageGenerator:
  quality: medium
  # Trim VLM scoring candidates (default 150) for the single-image case —
  # ~5x cheaper at minor relevance cost; 30 still gets a good top pick.
  max_candidates_to_score: 30

LLMHandler:
  model: gpt-5.6-luna
  reasoning_effort: low

AgentMemory:
  enabled: false
  use_graph: false

ChromaClientManager:
  model: gpt-5.6-luna
  reasoning_effort: low

BraveSearch:
  use_ddgs: True

Logger:
  include_caller_info: "rome"
  level: "info"
