[project]
name = "caesar-web-server"
version = "0.1.0"
description = "FastAPI server wrapping the Caesar autonomous research agent for a polished web demo."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
# S101/S608: allow asserts in tests, allow string-built SQL.
# S104: 0.0.0.0 binding is intentional for the LAN remote-access requirement.
# B008: FastAPI Depends() in default args is the documented pattern.
# ASYNC240: tolerate pathlib in async fns — local filesystem reads, no real
#           IO benefit from trio.Path here.
ignore = ["S101", "S608", "S104", "B008", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Parallel workers. 8 of 16 cores: the suite is ~44s serial and ~24s here,
# with diminishing returns past this (21s at -n 16) that aren't worth competing
# with the live public server for CPU. Tests are xdist-safe because the autouse
# isolated_data_dir fixture gives each one its own SQLite + runs/ under tmp_path.
addopts = ["-n", "8"]

# setuptools auto-discovery would otherwise pick up runtime data/ as a
# package once Caesar starts writing artifacts there. Pin it to app/.
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]
