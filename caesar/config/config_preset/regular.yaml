# Caesar Agent Configuration File
# Only includes settings that differ from DEFAULT_CONFIG

# ============================================================================
# AGENT CONFIGURATION
# ============================================================================
Agent:
  name: CaesarExplorer
  draw_fsm: false

# ============================================================================
# CAESAR-SPECIFIC CONFIGURATION
# ============================================================================
CaesarAgent:
  additional_starting_queries: 5
  max_web_searches: 20
  max_iterations: 250
  save_graph_interval: 50

  use_quick_explore: False
  quick_explore_insights: False
  exploration_llm_config:
    model: gpt-5.6-terra
    reasoning_effort: low

  # overwrite_role_file: config/role/self_transcend_role.txt
  # adapt_role_file: config/role/self_transcend_insights_v1.txt
  adapt_role: True

ArtifactSynthesizer:
  synthesis_iterations: 20
  synthesis_drafts: 3
  synthesis_merge_artifacts: true
  synthesis_eli5: false
  synthesis_eli5_length: [null, 450]
  synthesis_human_eval: false
  synthesis_max_length: null
  synthesis_iteration_filter: null

# ============================================================================
# LLM CONFIGURATION
# ============================================================================
LLMHandler:
  # Synthesis runs through the agent's handler (exploration has its own override
  # above), so this is the synthesis model.
  model: gpt-5.6-sol
  reasoning_effort: medium
  # Override the 900s default: sol needs the extra headroom, same as deepest.yaml.
  timeout: 1200

# ============================================================================
# KNOWLEDGE BASE CONFIGURATION
# ============================================================================
AgentMemory:
  enabled: true
  use_graph: false

ChromaClientManager:
  model: gpt-5.4-mini
  reasoning_effort: low

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
Logger:
  include_caller_info: "rome"
  level: "info"